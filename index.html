<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f3f6f4" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta
			name="description"
			content="Nico Betz – Frontend Developer. Dev Journey: Technologien, Erfahrung und GitHub-Projekte."
		/>
		<title>Nico Betz · Dev Journey</title>
		<script>
			(function () {
				try {
					var key = 'dev-journey-theme';
					var stored = localStorage.getItem(key);
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					if (theme === 'dark') document.documentElement.classList.add('dark');
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'dark' ? '#121614' : '#f3f6f4');
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
